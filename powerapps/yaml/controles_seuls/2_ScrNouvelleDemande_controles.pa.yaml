- nd_btnEnvoyer:
    Control: Classic/Button@2.2.0
    Properties:
      BorderColor: =RGBA(212, 66, 51, 1)
      BorderStyle: =BorderStyle.Solid
      BorderThickness: =1
      Color: =RGBA(255, 255, 255, 1)
      DisabledBorderColor: =RGBA(212, 222, 242, 1)
      DisabledColor: =RGBA(255, 255, 255, 1)
      DisabledFill: =RGBA(212, 222, 242, 1)
      DisplayMode: =If(varEnvoiEnCours, DisplayMode.Disabled, DisplayMode.Edit)
      Fill: =RGBA(212, 66, 51, 1)
      Font: =Font.Arial
      FontWeight: =FontWeight.Bold
      Height: =44
      HoverBorderColor: =RGBA(170, 50, 38, 1)
      HoverColor: =RGBA(255, 255, 255, 1)
      HoverFill: =RGBA(170, 50, 38, 1)
      OnSelect: |-
        =Notify("Envoi de " & CountRows(nd_galEchantillons.AllItems) & " échantillon(s) en cours…", NotificationType.Information);
        Set(varTentative, true);
        If(
            CountRows(Filter(nd_galEchantillons.AllItems, IsBlank(Trim(nd_txtNom.Text)))) > 0,
            Notify("Chaque échantillon doit avoir un nom.", NotificationType.Error),
            Set(varEnvoiEnCours, true);
            Clear(colCrees);
            ForAll(
                nd_galEchantillons.AllItems,
                Collect(
                    colCrees,
                    Patch(
                        'x_Déclaration_CODECOH',
                        Defaults('x_Déclaration_CODECOH'),
                        {
                            'Nom échantillon': Trim(nd_txtNom.Text),
                            'Référence commerciale': nd_txtRef.Text,
                            'Type de substance': nd_cbType.Selected,
                            'Tissue source': nd_txtSource.Text,
                            Pathologie: nd_cbPatho.Selected,
                            'Nom demandeur': User().FullName,
                            'Date enregistrement demande': Today()
                        }
                    )
                )
            );
            Set(varEnvoiEnCours, false);
            If(
                IsEmpty(Errors('x_Déclaration_CODECOH')),
                Notify(CountRows(colCrees) & " échantillon(s) déclaré(s) avec succès.", NotificationType.Success);
                Navigate(ScrMesDemandes, ScreenTransition.Fade),
                Notify("Erreur SharePoint : " & First(Errors('x_Déclaration_CODECOH')).Message, NotificationType.Error)
            )
        )
      PressedColor: =RGBA(255, 255, 255, 1)
      PressedFill: =RGBA(36, 34, 106, 1)
      RadiusBottomLeft: =4
      RadiusBottomRight: =4
      RadiusTopLeft: =4
      RadiusTopRight: =4
      Size: =13
      Text: =If(varEnvoiEnCours, "Envoi en cours…", "Envoyer " & CountRows(colEchantillons) & " demande(s)")
      Width: =264
      X: =Parent.Width - 296
      Y: =Parent.Height - 60
