    Variant: Vertical
    Properties:
      AccessibleLabel: ="Liste des échantillons à déclarer"
      BorderThickness: =0
      Fill: =RGBA(0, 0, 0, 0)
      Height: =Parent.Height - Self.Y - 92
      Items: =colEchantillons
      ShowScrollbar: =true
      TemplateFill: =RGBA(255, 255, 255, 1)
      TemplatePadding: =0
      TemplateSize: =56
      Width: =Parent.Width - 112
      X: =56
      Y: =nd_rectEntete.Y + nd_rectEntete.Height + 4
    Children:
      - nd_lblNum:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            Color: =RGBA(112, 136, 182, 1)
            Font: =Font.Arial
            FontWeight: =FontWeight.Bold
            Height: =36
            Size: =12
            Text: =CountRows(Filter(colEchantillons, Id <= ThisItem.Id))
            Width: =40
            X: =0
            Y: =10
      - nd_txtNom:
          Control: Classic/TextInput@2.3.2
          Properties:
            AccessibleLabel: ="Nom de l'échantillon"
            BorderColor: =If(varTentative && IsBlank(Trim(Self.Text)), RGBA(212, 66, 51, 1), RGBA(212, 222, 242, 1))
            BorderThickness: =1
            Color: =RGBA(49, 49, 49, 1)
            Default: =ThisItem.Nom
            Fill: =RGBA(255, 255, 255, 1)
            FocusedBorderColor: =RGBA(36, 34, 106, 1)
            FocusedBorderThickness: =2
            Font: =Font.Arial
            Height: =36
            HintText: ="Nom de l'échantillon"
            HoverBorderColor: =RGBA(112, 136, 182, 1)
            OnChange: |-
              =Patch(colEchantillons, LookUp(colEchantillons, Id = ThisItem.Id), {Nom: Self.Text})
            RadiusBottomLeft: =4
            RadiusBottomRight: =4
            RadiusTopLeft: =4
            RadiusTopRight: =4
            Size: =12
            Width: =(Parent.Width - 248 - 50) * 0.2400
            X: =96 - 56
