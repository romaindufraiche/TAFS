            BorderColor: =RGBA(212, 222, 242, 1)
            BorderThickness: =1
            Color: =RGBA(49, 49, 49, 1)
            Default: =ThisItem.Ref
            Fill: =RGBA(255, 255, 255, 1)
            FocusedBorderColor: =RGBA(36, 34, 106, 1)
            FocusedBorderThickness: =2
            Font: =Font.Arial
            Height: =36
            HintText: ="Réf. commerciale"
            HoverBorderColor: =RGBA(112, 136, 182, 1)
            OnChange: |-
              =Patch(colEchantillons, LookUp(colEchantillons, Id = ThisItem.Id), {Ref: Self.Text})
            RadiusBottomLeft: =4
            RadiusBottomRight: =4
            RadiusTopLeft: =4
            RadiusTopRight: =4
            Size: =12
            Width: =(Parent.Width - 248 - 40) * 0.2300
            X: =96 + (Parent.Width - 248 - 40) * 0.3100 + 10 - 56
            Y: =10
      - nd_txtSource:
          Control: Classic/TextInput@2.3.2
          Properties:
            AccessibleLabel: ="Tissue Source"
            BorderColor: =RGBA(212, 222, 242, 1)
            BorderThickness: =1
            Color: =RGBA(49, 49, 49, 1)
            Default: =ThisItem.Source
            Fill: =RGBA(255, 255, 255, 1)
            FocusedBorderColor: =RGBA(36, 34, 106, 1)
            FocusedBorderThickness: =2
            Font: =Font.Arial
            Height: =36
            HintText: ="Tissue Source"
            HoverBorderColor: =RGBA(112, 136, 182, 1)
            OnChange: |-
              =Patch(colEchantillons, LookUp(colEchantillons, Id = ThisItem.Id), {Source: Self.Text})
            RadiusBottomLeft: =4
            RadiusBottomRight: =4
            RadiusTopLeft: =4
            RadiusTopRight: =4
            Size: =12
            Width: =(Parent.Width - 248 - 40) * 0.2300
            X: =96 + (Parent.Width - 248 - 40) * 0.3100 + 10 + (Parent.Width - 248 - 40) * 0.2300 + 10 - 56
            Y: =10
      - nd_txtPatho:
          Control: Classic/TextInput@2.3.2
          Properties:
            AccessibleLabel: ="Pathologie"
