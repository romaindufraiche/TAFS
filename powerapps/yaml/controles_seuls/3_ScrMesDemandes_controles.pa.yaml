- Gallery1:
    Control: Gallery@2.15.0
    Variant: Vertical
    Properties:
      AccessibleLabel: ="Liste de mes demandes"
      Fill: =RGBA(0, 0, 0, 0)
      Height: =Parent.Height - 198
      Items: |-
        =SortByColumns(
            Filter(
                'x_Déclaration_CODECOH',
                Author.Email = User().Email,
                IsBlank(md_txtRecherche.Text) || StartsWith('Nom échantillon', md_txtRecherche.Text)
            ),
            "ID",
            SortOrder.Descending
        )
      OnSelect: =Navigate(ScrDetailDemande, ScreenTransition.Cover)
      TemplateFill: =If(ThisItem.IsSelected, RGBA(235, 235, 249, 1), RGBA(255, 255, 255, 1))
      TemplatePadding: =0
      TemplateSize: =72
      Width: =Parent.Width - 66
      X: =33
      Y: =165
    Children:
      - Title1:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(36, 34, 106, 1)
            Font: =Font.Arial
            FontWeight: =FontWeight.Bold
            Height: =28
            OnSelect: =Select(Parent)
            Size: =14
            Text: =ThisItem.'Nom échantillon'
            Width: =Parent.TemplateWidth - 340
            X: =24
            Y: =10
      - Subtitle1:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(49, 49, 49, 1)
            Font: =Font.Arial
            FontWeight: =FontWeight.Normal
            Height: =24
            OnSelect: =Select(Parent)
            Size: =12
            Text: =Concatenate(If(IsBlank(ThisItem.'Référence commerciale'), "", "Réf. " & ThisItem.'Référence commerciale' & "   "), If(IsBlank(ThisItem.'Type de substance'.Value), "", ThisItem.'Type de substance'.Value & "   "), If(IsBlank(ThisItem.Pathologie.Value), "", "· " & ThisItem.Pathologie.Value))
            Width: =Parent.TemplateWidth - 340
            X: =24
            Y: =40
      - md_lblDate:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Right
            Color: =RGBA(112, 136, 182, 1)
            Font: =Font.Arial
            FontWeight: =FontWeight.Normal
            Height: =24
            OnSelect: =Select(Parent)
            Size: =11
            Text: ="Enregistrée le " & Text(ThisItem.'Date enregistrement demande', "dd/mm/yyyy")
            Width: =220
            X: =Parent.TemplateWidth - 300
            Y: =10
      - md_lblDemandeur:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Right
            Color: =RGBA(36, 34, 106, 1)
            Font: =Font.Arial
            FontWeight: =FontWeight.Bold
            Height: =24
            OnSelect: =Select(Parent)
            Size: =11
            Text: =ThisItem.'Nom demandeur'
            Width: =220
            X: =Parent.TemplateWidth - 300
            Y: =38
      - NextArrow1:
          Control: Classic/Icon@2.5.0
          Properties:
            AccessibleLabel: =Self.Tooltip
            Color: =RGBA(36, 34, 106, 1)
            Height: =40
            Icon: =Icon.ChevronRight
            OnSelect: =Navigate(ScrDetailDemande, ScreenTransition.Cover)
            Tooltip: ="Afficher le détail"
            Width: =40
            X: =Parent.TemplateWidth - 64
            Y: =18
      - Rectangle1:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =RGBA(212, 66, 51, 1)
            Height: =Parent.TemplateHeight - 1
            OnSelect: =Select(Parent)
            Visible: =ThisItem.IsSelected
            Width: =4
            X: =0
            Y: =0
      - Separator1:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =RGBA(212, 222, 242, 1)
            Height: =1
            OnSelect: =Select(Parent)
            Width: =Parent.TemplateWidth
            X: =0
            Y: =Parent.TemplateHeight - 1
