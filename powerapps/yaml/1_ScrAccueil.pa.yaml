Screens:
  ScrAccueil:
    Properties:
      Fill: =RGBA(235, 235, 249, 1)
      LoadingSpinnerColor: =RGBA(36, 34, 106, 1)
    Children:
      - acc_rectHeader:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =RGBA(255, 255, 255, 1)
            Height: =88
            Width: =Parent.Width
            X: =0
            Y: =0
      - acc_rectAccent:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =RGBA(212, 66, 51, 1)
            Height: =4
            Width: =Parent.Width
            X: =0
            Y: =88
      - acc_imgLogo:
          Control: Image@2.2.3
          Properties:
            Height: =64
            Image: ='logo ABC'
            ImagePosition: =ImagePosition.Fit
            Width: =96
            X: =32
            Y: =12
      - acc_lblTitre:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(36, 34, 106, 1)
            Font: =Font.Arial
            FontWeight: =FontWeight.Bold
            Height: =36
            Size: =20
            Text: ="Portail CODECOH"
            Width: =900
            X: =148
            Y: =14
      - acc_lblSousTitre:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(112, 136, 182, 1)
            Font: =Font.Arial
            FontWeight: =FontWeight.Normal
            Height: =26
            Size: =12
            Text: ="Gestion des demandes d'échantillons"
            Width: =900
            X: =148
            Y: =50
      - acc_lblBonjour:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(36, 34, 106, 1)
            Font: =Font.Arial
            FontWeight: =FontWeight.Bold
            Height: =40
            Size: =22
            Text: ="Bonjour " & User().FullName
            Width: =1220
            X: =(Parent.Width - 1220) / 2
            Y: =140
      - acc_lblIntro:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(112, 136, 182, 1)
            Font: =Font.Arial
            FontWeight: =FontWeight.Normal
            Height: =30
            Size: =13
            Text: ="Commencez par vérifier si l'échantillon existe déjà dans la bibliothèque."
            Width: =1220
            X: =(Parent.Width - 1220) / 2
            Y: =182
      - acc_btnBibliotheque:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(36, 34, 106, 1)
            BorderStyle: =BorderStyle.Solid
            BorderThickness: =1
            Color: =RGBA(255, 255, 255, 1)
            DisabledBorderColor: =RGBA(212, 222, 242, 1)
            DisabledColor: =RGBA(255, 255, 255, 1)
            DisabledFill: =RGBA(212, 222, 242, 1)
            Fill: =RGBA(36, 34, 106, 1)
            Font: =Font.Arial
            FontWeight: =FontWeight.Bold
            Height: =230
            HoverBorderColor: =RGBA(112, 136, 182, 1)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =RGBA(112, 136, 182, 1)
            OnSelect: =Navigate(ScrBibliotheque, ScreenTransition.Cover)
            PaddingTop: =40
            PressedColor: =RGBA(255, 255, 255, 1)
            PressedFill: =RGBA(36, 34, 106, 1)
            RadiusBottomLeft: =8
            RadiusBottomRight: =8
            RadiusTopLeft: =8
            RadiusTopRight: =8
            Size: =22
            Text: ="Bibliothèque des échantillons"
            VerticalAlign: =VerticalAlign.Middle
            Width: =380
            X: =(Parent.Width - 1220) / 2
            Y: =250
      - acc_icoBibliotheque:
          Control: Classic/Icon@2.5.0
          Properties:
            AccessibleLabel: =Self.Tooltip
            Color: =RGBA(255, 255, 255, 1)
            Height: =64
            Icon: =Icon.Search
            OnSelect: =Navigate(ScrBibliotheque, ScreenTransition.Cover)
            Tooltip: ="Bibliothèque des échantillons"
            Width: =64
            X: =(Parent.Width - 1220) / 2 + 158
            Y: =290
      - acc_rectBibliotheque:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =RGBA(212, 66, 51, 1)
            Height: =4
            Width: =60
            X: =(Parent.Width - 1220) / 2 + 160
            Y: =452
      - acc_lblBibliothequeDesc:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            Color: =RGBA(49, 49, 49, 1)
            Font: =Font.Arial
            FontWeight: =FontWeight.Normal
            Height: =60
            Size: =12
            Text: ="Rechercher si un échantillon est déjà déclaré"
            Width: =380
            X: =(Parent.Width - 1220) / 2
            Y: =492
