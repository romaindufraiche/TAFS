                  X: =96 + (Parent.Width - 248 - 60) * 0.1900 + 10 + (Parent.Width - 248 - 60) * 0.1500 + 10 + (Parent.Width - 248 - 60) * 0.1500 + 10 + (Parent.Width - 248 - 60) * 0.1500 + 10 - 56
                  Y: =10
            - nd_txtFourn:
