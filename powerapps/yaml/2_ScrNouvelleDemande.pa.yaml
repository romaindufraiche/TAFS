                  Fill: =RGBA(255, 255, 255, 1)
                  FocusedBorderColor: =RGBA(36, 34, 106, 1)
                  FocusedBorderThickness: =2
                  Font: =Font.Arial
                  Height: =36
                  HintText: ="Réf. commerciale"
                  HoverBorderColor: =RGBA(112, 136, 182, 1)
                  OnChange: |-
                    =Patch(colEchantillons, LookUp(colEchantillons, Id = ThisItem.Id), {Ref: Self.Text})
                  RadiusBottomLeft: =4
                  RadiusBottomRight: =4
                  RadiusTopLeft: =4
                  RadiusTopRight: =4
                  Size: =12
                  Width: =(Parent.Width - 248 - 60) * 0.1500
