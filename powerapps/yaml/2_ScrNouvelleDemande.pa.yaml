                  Height: =32
                  Icon: =Icon.Trash
                  OnSelect: =Remove(colEchantillons, LookUp(colEchantillons, Id = ThisItem.Id))
                  PaddingBottom: =4
                  PaddingLeft: =4
                  PaddingRight: =4
                  PaddingTop: =4
                  Tooltip: ="Supprimer cette ligne"
                  Width: =32
                  X: =Parent.TemplateWidth - 44
