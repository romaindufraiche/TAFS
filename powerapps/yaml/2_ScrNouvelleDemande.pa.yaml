                  X: =96 + (Parent.Width - 248 - 60) * 0.1900 + 10 + (Parent.Width - 248 - 60) * 0.1500 + 10 + (Parent.Width - 248 - 60) * 0.1500 + 10 - 56
                  Y: =10
            - nd_txtPatho:
                Control: Classic/TextInput@2.3.2
                Properties:
                  AccessibleLabel: ="Pathologie"
                  BorderColor: =RGBA(212, 222, 242, 1)
                  BorderThickness: =1
                  Color: =RGBA(49, 49, 49, 1)
