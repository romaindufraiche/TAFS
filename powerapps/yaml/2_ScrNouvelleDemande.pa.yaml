Screens:
  ScrNouvelleDemande:
    Properties:
      Fill: =RGBA(235, 235, 249, 1)
      LoadingSpinnerColor: =RGBA(36, 34, 106, 1)
      OnVisible: |-
        =Set(varTentative, false);
        Set(varEnvoiEnCours, false);
        Set(varNextId, 1);
        ClearCollect(colEchantillons, {Id: varNextId, Nom: "", Ref: "", TypeSub: "", Source: "", Patho: "", Fourn: ""});
        Set(varNextId, 2);
        Reset(nd_attPJ)
    Children:
      - nd_rectHeader:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =RGBA(255, 255, 255, 1)
            Height: =88
            Width: =Parent.Width
            X: =0
            Y: =0
      - nd_rectAccent:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =RGBA(212, 66, 51, 1)
            Height: =4
            Width: =Parent.Width
            X: =0
            Y: =88
      - nd_imgLogo:
          Control: Image@2.2.3
          Properties:
            Height: =64
            Image: ='logo ABC'
            ImagePosition: =ImagePosition.Fit
            Width: =96
            X: =32
            Y: =12
      - nd_lblTitre:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(36, 34, 106, 1)
            Font: =Font.Arial
            FontWeight: =FontWeight.Bold
            Height: =36
            Size: =20
            Text: ="Nouvelle demande"
            Width: =900
            X: =148
            Y: =14
      - nd_lblSousTitre:
